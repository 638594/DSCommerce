# ===============================
# CONFIGURAÇÃO DE BANCO DE DADOS
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/dscommerce
spring.datasource.username=admin
spring.datasource.password=admin_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ===============================
# Mostra o SQL gerado no console (útil para ambiente dev)
spring.jpa.show-sql=true

# Formata o SQL no console para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# Estratégia de atualização do banco (update altera as tabelas sem apagar os dados)
spring.jpa.hibernate.ddl-auto=update

# Dialeto do PostgreSQL para o Hibernate
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect